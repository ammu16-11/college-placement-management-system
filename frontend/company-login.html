<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: min(350px, calc(100% - 60px));
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #1e3a8a; }
        label { display: block; margin-top: 15px; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .links { text-align: center; margin-top: 18px; }
        #message { text-align: center; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Company Login</h2>


    <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" required>

        <button type="submit">Sign In</button>
    </form>

    <p id="message" role="status"></p>

    <div class="links">
        <p>New company?</p>
        <a href="company-signup.html">Create Company Account</a>
        <p><a href="index.html">Back to Home</a></p>
    </div>
</div>

<script>
    const API_URL = "http://3.106.120.107:5000";

    document.getElementById("loginForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const message = document.getElementById("message");
        message.textContent = "Signing in...";

        try {
            const response = await fetch(`${API_URL}/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: document.getElementById("email").value,
                    password: document.getElementById("password").value
                })
            });

            const result = await response.json();

            if (!response.ok || result.status !== "success") {
                throw new Error(result.message || "Login failed");
            }

            if (result.role !== "COMPANY") {
                throw new Error("This account is not registered as a company");
            }

            localStorage.setItem("user_id", result.user_id);
            localStorage.setItem("user_name", result.name);
            localStorage.setItem("user_email", result.email);
            localStorage.setItem("user_role", result.role);

            window.location.href = "company-dashboard.html";
        } catch (error) {
            message.textContent = error.message;
        }
    });
</script>

</body>
</html>
