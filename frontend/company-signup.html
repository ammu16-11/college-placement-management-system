    <div class="container">
        <h2>Company Sign Up</h2>

```
    <form id="signupForm">
        <label for="name">Contact Person Name *</label>
        <input type="text" id="name" maxlength="100" required>

        <label for="company_name">Company Name *</label>
        <input type="text" id="company_name" maxlength="150" required>

        <label for="email">Company Email *</label>
        <input type="email" id="email" maxlength="150" required>

        <label for="password">Password *</label>
        <input type="password" id="password" minlength="8" required>

        <label for="confirm_password">Confirm Password *</label>
        <input type="password" id="confirm_password" minlength="8" required>

        <label for="industry">Industry</label>
        <input type="text" id="industry" maxlength="100">

        <label for="website">Website</label>
        <input type="url" id="website" maxlength="255" placeholder="https://example.com">

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" maxlength="20">

        <button type="submit">Create Company Account</button>
    </form>

    <p id="message" role="status"></p>

    <div class="links">
        <p>Already registered?</p>
        <a href="company-login.html">Sign In</a>
        <p><a href="index.html">Back to Home</a></p>
    </div>
</div>

<script>
    const API_URL = "http://3.106.120.107:5000";

    document.getElementById("signupForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const message = document.getElementById("message");
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirm_password").value;

        if (password !== confirmPassword) {
            message.textContent = "Passwords do not match.";
            return;
        }

        message.textContent = "Creating account...";

        try {
            const response = await fetch(`${API_URL}/register/company`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: document.getElementById("name").value.trim(),
                    company_name: document.getElementById("company_name").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    password: password,
                    industry: document.getElementById("industry").value.trim(),
                    website: document.getElementById("website").value.trim(),
                    phone: document.getElementById("phone").value.trim()
                })
            });

            const result = await response.json();

            if (!response.ok || result.status !== "success") {
                throw new Error(result.message || "Registration failed.");
            }

            message.textContent = "Account created successfully! Redirecting to sign in...";

            document.getElementById("signupForm").reset();

            setTimeout(() => {
                window.location.href = "company-login.html";
            }, 1500);
        } catch (error) {
            message.textContent = error.message || "Unable to connect to the server.";
        }
    });
</script>
